      - name: Kanal Listesini Olustur
        run: |
          python - <<EOF
          import cloudscraper
          import os

          file_path = "playlist.m3u"
          proxy_base = "https://backdor-proxy.onrender.com/proxy?link="
          url = "https://vjackson.info/live/index?output=json"
          
          # Dosyanın varlığından emin olmak için boş bir dosya oluşturuyoruz
          with open(file_path, "w", encoding="utf-8") as f:
              f.write("#EXTM3U\n")

          scraper = cloudscraper.create_scraper()
          try:
              response = scraper.get(url, timeout=60)
              if response.status_code == 200:
                  channels = response.json()
                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write("#EXTM3U\n")
                      count = 0
                      for ch in channels:
                          if ch.get('group') == 'Turkey':
                              name = ch.get('name', 'Kanal')
                              ch_url = ch.get('url')
                              f.write(f'#EXTINF:-1 group-title="Vavoo-TR",{name}\n')
                              f.write(f"{proxy_base}{ch_url}\n")
                              count += 1
                  print(f"Basarili: {count} kanal eklendi.")
              else:
                  print(f"Sunucu Hatasi: {response.status_code}")
          except Exception as e:
              print(f"Hata: {e}")
          EOF

      - name: GitHub'a Yukle
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Sadece dosya varsa ekle, yoksa hata verme
          if [ -f playlist.m3u ]; then
            git add playlist.m3u
            git commit -m "Vavoo listesi guncellendi" || echo "Degisiklik yok"
            git push
          fi
          
