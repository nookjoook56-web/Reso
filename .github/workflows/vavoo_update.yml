name: Vavoo Proxy List Güncelleyici

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir çalışır
  workflow_dispatch: # Manuel çalıştırmak için düğme ekler

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Bağımlılıkları Yükle
      run: pip install requests cloudscraper

    - name: Vavoo Listesini Güncelle
      run: |
        python - <<EOF
        import cloudscraper
        import os

        proxy_base = "https://backdor-proxy.onrender.com/proxy?link="
        url = "https://vjackson.info/live/index?output=json"
        
        scraper = cloudscraper.create_scraper()
        try:
            response = scraper.get(url, timeout=30)
            if response.status_code == 200:
                channels = response.json()
                with open("playlist.m3u", "w", encoding="utf-8") as f:
                    f.write("#EXTM3U\n")
                    for ch in channels:
                        if ch.get('group') == 'Turkey':
                            name = ch.get('name', 'Kanal')
                            ch_url = ch.get('url')
                            f.write(f'#EXTINF:-1 group-title="Vavoo-TR",{name}\n')
                            f.write(f"{proxy_base}{ch_url}\n")
                print("Liste başarıyla güncellendi.")
            else:
                print(f"Hata Kodu: {response.status_code}")
        except Exception as e:
            print(f"Hata: {e}")
        EOF

    - name: Değişiklikleri Kaydet ve Gönder
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add playlist.m3u
        git commit -m "Vavoo listesi proxy ile güncellendi" || exit 0
        git push
        
