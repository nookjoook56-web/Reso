name: Otomatik Kanal Guncelleme
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Kur
        run: pip install requests cloudscraper

      - name: Verileri Guncelle
        run: |
          python vavoo_get.py --json > kanallar.json || echo "Veri cekilemedi"
          python donusturucu.py || echo "Donusturucu yok, devam ediliyor"

      - name: Degisiklikleri Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Sistem hatalari giderildi: $(date)" || exit 0
          git push
