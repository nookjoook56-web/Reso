name: Vavoo Otomatik Guncelleyici

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir calisir
  workflow_dispatch: # Manuel baslatma butonu ekler

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Python ve Kutuphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper requests

      - name: Kanallari Vavoo'dan Cek
        run: |
          python - <<EOF
          import cloudscraper
          import os

          file_path = "playlist.m3u"
          proxy_base = "https://backdor-proxy.onrender.com/proxy?link="
          url = "https://vjackson.info/live/index?output=json"
          
          scraper = cloudscraper.create_scraper()
          try:
              response = scraper.get(url, timeout=60)
              if response.status_code == 200:
                  channels = response.json()
                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write("#EXTM3U\n")
                      count = 0
                      for ch in channels:
                          # Hem Turkiye hem de Spor kanallarini filtrele
                          group = ch.get('group', '')
                          if group in ['Turkey', 'Spain', 'Germany']: # Beinsportlar genellikle bu gruplardadir
                              name = ch.get('name', 'Kanal')
                              ch_url = ch.get('url')
                              # Sadece Beinsport icerenleri veya TR kanallarini al
                              if "Bein" in name or group == 'Turkey':
                                  f.write(f'#EXTINF:-1 group-title="{group}",{name}\n')
                                  f.write(f"{proxy_base}{ch_url}\n")
                                  count += 1
                  print(f"Basarili: {count} kanal eklendi.")
              else:
                  print(f"Hata: {response.status_code}")
          except Exception as e:
              print(f"Hata: {e}")
          EOF

      - name: Degisiklikleri Kaydet
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          git commit -m "Otomatik Vavoo & Beinsport Guncellemesi" || exit 0
          git push origin main
          
