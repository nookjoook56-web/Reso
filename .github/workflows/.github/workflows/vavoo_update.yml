name: Vavoo Otomatik Guncelleyici

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Python Kur ve Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper requests

      - name: Kanal Listesini Olustur
        run: |
          python - <<EOF
          import cloudscraper
          import os

          file_path = "playlist.m3u"
          proxy_base = "https://backdor-proxy.onrender.com/proxy?link="
          url = "https://vjackson.info/live/index?output=json"
          
          scraper = cloudscraper.create_scraper()
          try:
              response = scraper.get(url, timeout=60)
              if response.status_code == 200:
                  channels = response.json()
                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write("#EXTM3U\n")
                      count = 0
                      for ch in channels:
                          name = ch.get('name', '').upper()
                          group = ch.get('group', '')
                          ch_url = ch.get('url', '')
                          
                          # Filtre: Türkiye kanalları veya isminde BEIN/SPOR geçenler
                          if group == 'Turkey' or "BEIN" in name or "SPOR" in name:
                              f.write(f'#EXTINF:-1 group-title="{group}",{ch.get("name")}\n')
                              f.write(f"{proxy_base}{ch_url}\n")
                              count += 1
                  print(f"Basarili: {count} kanal eklendi.")
              else:
                  print(f"Sunucu Hatasi: {response.status_code}")
          except Exception as e:
              print(f"Hata: {e}")
          EOF

      - name: GitHub'a Yukle
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f playlist.m3u ]; then
            git add playlist.m3u
            git commit -m "Vavoo & Beinsport listesi guncellendi" || exit 0
            git push origin main
          fi
