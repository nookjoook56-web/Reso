<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESO MERKEZİ SİSTEM</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 20px; }
        h1 { color: #e50914; border-left: 5px solid #e50914; padding-left: 10px; }
        .search-box { width: 100%; padding: 12px; margin: 20px 0; background: #222; color: #fff; border: 1px solid #333; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; background: #141414; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #222; }
        .btn-izle { background: #e50914; color: #fff; padding: 5px 15px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>| RESO MERKEZİ SİSTEM</h1>
    <input type="text" id="src" class="search-box" placeholder="Kanal ara...">
    <table>
        <thead><tr><th>GRUP</th><th>KANAL</th><th>İŞLEM</th></tr></thead>
        <tbody id="tb"></tbody>
    </table>
    <script>
        fetch('kanallar.json').then(r => r.json()).then(data => {
            const tb = document.getElementById('tb');
            const src = document.getElementById('src');
            const show = (d) => {
                tb.innerHTML = d.map(i => `<tr><td>${i.group}</td><td>${i.name}</td><td><a href="${i.url}" class="btn-izle">İZLE</a></td></tr>`).join('');
            };
            show(data);
            src.oninput = (e) => show(data.filter(i => i.name.toLowerCase().includes(e.target.value.toLowerCase())));
        }).catch(() => { document.body.innerHTML += '<p style="color:yellow">Hata: Veri yuklenemedi!</p>'; });
    </script>
</body>
</html>
