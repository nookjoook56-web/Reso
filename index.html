<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESO MERKEZİ SİSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: 'Roboto', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h1 { font-family: 'Oswald', sans-serif; color: #e50914; border-left: 5px solid #e50914; padding-left: 15px; text-transform: uppercase; margin-bottom: 30px; }
        .search-box { width: 100%; padding: 12px; margin-bottom: 20px; border: none; border-radius: 5px; background: #222; color: #fff; font-size: 16px; box-sizing: border-box; border: 1px solid #333; }
        .search-box:focus { outline: 2px solid #e50914; }
        table { width: 100%; border-collapse: collapse; background: #141414; border-radius: 8px; overflow: hidden; }
        th { background: #1f1f1f; color: #ffc107; padding: 15px; text-align: left; text-transform: uppercase; font-size: 14px; }
        td { padding: 15px; border-bottom: 1px solid #222; font-size: 15px; }
        tr:hover { background: #222; }
        .btn-izle { background: #e50914; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 13px; transition: 0.3s; display: inline-block; }
        .group-badge { background: #333; padding: 4px 8px; border-radius: 3px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>| RESO MERKEZİ SİSTEM</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="Kanal veya kategori ara...">
        <table id="channelTable">
            <thead>
                <tr>
                    <th>GRUP</th>
                    <th>KANAL</th>
                    <th style="text-align: center;">İŞLEM</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <script>
        async function loadChannels() {
            try {
                const response = await fetch('kanallar.json');
                const data = await response.json();
                const tableBody = document.getElementById('tableBody');
                const searchInput = document.getElementById('searchInput');
                function displayChannels(channels) {
                    tableBody.innerHTML = '';
                    channels.forEach(item => {
                        const row = `<tr>
                            <td><span class="group-badge">${item.group}</span></td>
                            <td style="font-weight:bold;">${item.name}</td>
                            <td style="text-align: center;"><a href="${item.url}" class="btn-izle">İZLE</a></td>
                        </tr>`;
                        tableBody.innerHTML += row;
                    });
                }
                displayChannels(data);
                searchInput.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = data.filter(item => 
                        item.name.toLowerCase().includes(term) || 
                        item.group.toLowerCase().includes(term)
                    );
                    displayChannels(filtered);
                });
            } catch (error) {
                console.error('Hata:', error);
            }
        }
        loadChannels();
    </script>
</body>
</html>
